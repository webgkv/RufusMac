name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Liquid Glass needs the macOS 26 SDK (Xcode 26). Use a macOS 26 runner
    # image when available; otherwise pin the appropriate runner/Xcode.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version || true

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test || echo "Tests require the Swift Testing framework (full Xcode)."

      - name: Package portable .dmg
        run: scripts/make_dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RufusMac-dmg
          path: dist/RufusMac.dmg
          if-no-files-found: warn
